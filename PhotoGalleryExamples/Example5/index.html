<!doctype html>
<title>Photo Gallery Example Align Items flex-end</title>
<style>
  /* Flex container for the image gallery */
  .cards {
    display: flex; /* Enables flexbox layout */
    flex-wrap: wrap; /* Allows images to wrap onto the next line */
    align-items: flex-end; /* Aligns images at the bottom of the tallest image */
  }

  /* Styling for images inside the gallery */
  .cards img {
    margin: 10px; /* Adds space around each image */
    border: 3px solid #000; /* Adds a black border to each image */
    box-shadow: 3px 3px 8px 0px rgba(0,0,0,0.3); /* Adds a soft shadow effect */
    max-width: 25vw; /* Ensures images take up a maximum of 25% of the viewport width */
  }
</style>

<!-- Main container for the image gallery -->
<main class="cards">
  <!-- Sample images displayed in the gallery -->
  <img src="/Sample/image1.jpg" alt="Sample photo">
  <img src="/Sample/image2.jpg" alt="Sample photo">
  <img src="/Sample/image3.jpg" alt="Sample photo">
  <img src="/Sample/image4.jpg" alt="Sample photo">
  <img src="/Sample/image5.jpg" alt="Sample photo">
  <img src="/Sample/image6.jpg" alt="Sample photo">
</main>
